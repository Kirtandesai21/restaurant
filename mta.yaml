_schema-version: 3.3.0
ID: restaurant
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
        - node copy-ui.js
modules:
  - name: restaurant-srv
    type: nodejs
    path: gen/srv
    parameters:
      instances: 1
      buildpack: nodejs_buildpack
      routes:
        - route: restaurant-srv.cfapps.us10-001.hana.ondemand.com
        - route: 062d3605trial-dev-restaurant-srv.cfapps.us10-001.hana.ondemand.com
    build-parameters:
      builder: npm-ci
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: restaurant-auth
      - name: restaurant-db

  - name: restaurant-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: restaurant-db

  - name: restaurant-app
    type: approuter.nodejs
    path: approuter
    parameters:
      disk-quota: 256M
      memory: 128M
      routes:
        - route: restaurant-app.cfapps.us10-001.hana.ondemand.com
        - route: 062d3605trial-dev-restaurant-app.cfapps.us10-001.hana.ondemand.com
    build-parameters:
      builder: npm-ci
    requires:
      - name: restaurant-auth
      - name: srv-api
        group: destinations
        properties:
          name: srv-api
          url: ~{srv-url}
          forwardAuthToken: true

resources:
  - name: restaurant-auth
    type: org.cloudfoundry.managed-service
    parameters:
      service: xsuaa
      service-plan: application
      path: ./xs-security.json
      config:
        xsappname: restaurant-${org}-${space}
        tenant-mode: dedicated
        oauth2-configuration:
          credential-types:
            - "binding-secret"
            - "x509"
  - name: restaurant-db
    type: com.sap.xs.hdi-container
    parameters:
      service: hana
      service-plan: hdi-shared
